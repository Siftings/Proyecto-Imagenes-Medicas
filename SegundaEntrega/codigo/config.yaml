# evaluación final (resultados/prueba_excluidos.csv).
revision_visual:
  mismo_ojo:
    - [train/023, train/024]
    - [train/026, train/027]
    - [train/036, train/037]
    - [train/050, train/052]
    - [test/158, train/159]
    - [train/169, test/170]
    - [train/180, test/181]
    - [train/300, train/301]
    - [test/313, train/314]
  distinto_ojo:
    - [train/300, test/005]
